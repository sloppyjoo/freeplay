name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: dropdown
    id: device
    attributes:
      label: Your device
      options:
        - Play+
        - Original Play (RT, the Slice menu appears)
        - Original Play (K66, or the Slice menu doesn't appear)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FreePlay version
      description: Settings → Firmware
      placeholder: 1.3.0-FreePlay0.1b
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, step by step, what you expected, and what happened instead. If it froze, what screen were you on, and what did you press last?
    validations:
      required: true
  - type: textarea
    id: photo
    attributes:
      label: Photos or recordings
      description: A photo of the screen helps a lot. For sound problems, a short recording is great. You can drag files in here.
